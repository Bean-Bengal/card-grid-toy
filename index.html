<script>
var MIN=160, GAP=8, PAD=16;
function columnsFor(width,min,gap,pad){
  var inner=width-pad; if(inner<=0)return 1;
  var n=Math.floor((inner+gap)/(min+gap));
  return n<1?1:n;
}
function columnsBroken(width,min,gap,pad){
  var n=Math.floor((width-pad)/min)-1; return n<1?1:n;
}
function check(fn){
  var cases=[[100,1],[0,1],[PAD+159,1],[PAD+160,1],[PAD+327,1],[PAD+328,2],[PAD+495,2],[PAD+496,3],[1000,5]];
  for(var i=0;i<cases.length;i++){if(fn(cases[i][0],MIN,GAP,PAD)!==cases[i][1])return false;}
  return true;
}
var b=document.getElementById('banner');
try{
  var good=check(columnsFor), bad=check(columnsBroken);
  if(good&&!bad){b.className='ok';b.textContent='PASS: rule matches boundary cases, broken twin rejected';}
  else{b.className='bad';b.textContent='FAILED: good='+good+' broken passes='+bad;}
}catch(e){b.className='bad';b.textContent='FAILED: '+e;}
var ids=[387,386,383,378,376,371,368,362,360,359,358,379];
var cols=['#e9d5c1','#c9e4c5','#f4c7c3','#cfe0f1','#f8e8a8','#d9c8ec'];
var em=['🐱','🐦','🍜','🌿','🎨','⭐'];
var g=document.getElementById('grid');
ids.forEach(function(id,i){
  var d=document.createElement('div');d.className='card';
  var t=document.createElement('div');t.className='tile';
  t.style.background=cols[i%6];t.textContent=em[i%6];
  var l=document.createElement('div');l.textContent='#'+id;
  d.appendChild(t);d.appendChild(l);
  g.appendChild(d);
});
var s=document.getElementById('s');
function upd(){
  var w=+s.value, n=columnsFor(w,MIN,GAP,PAD);
  document.getElementById('screen').style.width=w+'px';
  g.style.gridTemplateColumns='repeat('+n+',minmax(0,1fr))';
  document.getElementById('w').textContent=w;
  document.getElementById('c').textContent=n;
  var gd=document.getElementById('guard');
  gd.textContent='dotted: min(100%, 10rem) = '+Math.round(gd.getBoundingClientRect().width)+'px';
}
s.oninput=upd;upd();
</script></body></html>
